version: '3.8'
services:
  postgres:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-docmansystem}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-prod_password}
      POSTGRES_DB: ${POSTGRES_DB:-docmansystem_prod}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - docman_network

  minio:
    image: minio/minio:RELEASE.2024-01-28T22-35-53Z
    restart: always
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-prod_miniopassword}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - docman_network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-docmansystem}:${POSTGRES_PASSWORD:-prod_password}@postgres:5432/${POSTGRES_DB:-docmansystem_prod}?schema=public
      S3_ENDPOINT: minio
      S3_PORT: 9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-prod_miniopassword}
      S3_BUCKET: docmansystem
      API_PORT: 4000
      WEB_ORIGIN: "https://docmans.hvqy.edu.vn"
      TRUST_PROXY: "loopback, linklocal, uniquelocal"
    depends_on:
      - postgres
      - minio
    networks:
      - docman_network

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - app
    networks:
      - docman_network

volumes:
  postgres_data:
  minio_data:

networks:
  docman_network:
    driver: bridge
