# Production stack. Usage:
#   cp .env.production.example .env.production   # fill in every value
#   place TLS files at nginx/ssl/fullchain.pem and nginx/ssl/privkey.pem
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
# Every secret is required (${VAR:?...}); there are intentionally no fallback passwords.
# Only nginx publishes ports; postgres, minio, api and web stay on the internal network.

x-app-image: &app-image
  image: docmans-app:${APP_VERSION:-latest}
  build:
    context: .
    dockerfile: Dockerfile
    args:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-/api/v1}
  restart: unless-stopped
  networks: [internal]

x-api-env: &api-env
  NODE_ENV: production
  DATABASE_URL: postgresql://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}?schema=public
  MINIO_ENDPOINT: minio
  MINIO_PORT: "9000"
  MINIO_USE_SSL: "false"
  MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
  MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
  MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-docmans-files}
  MINIO_REGION: ${MINIO_REGION:-us-east-1}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]

  minio:
    # Pin to a specific RELEASE tag you have validated before go-live.
    image: ${MINIO_IMAGE:-quay.io/minio/minio:latest}
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]

  # One-shot: apply migrations, then the production seed (catalogs + bootstrap admin only).
  migrate:
    <<: *app-image
    restart: "no"
    command: ["sh", "-c", "node node_modules/prisma/build/index.js migrate deploy && node apps/api/prisma/seed.mjs"]
    environment:
      <<: *api-env
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      # Required only on the very first deploy; ignored once the admin exists.
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  api:
    <<: *app-image
    command: ["node", "dist/apps/api/main.js"]
    environment:
      <<: *api-env
      API_PORT: "4000"
      WEB_ORIGIN: ${PUBLIC_URL:?PUBLIC_URL is required}
      ACCOUNT_LOGIN_URL: ${PUBLIC_URL:?PUBLIC_URL is required}/login
      APP_BASE_URL: ${PUBLIC_URL:?PUBLIC_URL is required}
      DEADLINE_REMINDERS_ENABLED: ${DEADLINE_REMINDERS_ENABLED:-true}
      TRUST_PROXY: "loopback, linklocal, uniquelocal"
      FILE_MAX_UPLOAD_BYTES: ${FILE_MAX_UPLOAD_BYTES:-10485760}
      FILE_ALLOWED_EXTENSIONS: ${FILE_ALLOWED_EXTENSIONS:-.doc,.docx,.pdf,.xls,.xlsx}
      SMTP_HOST: ${SMTP_HOST:?SMTP_HOST is required}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:?SMTP_FROM is required}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    <<: *app-image
    command: ["node", "node_modules/next/dist/bin/next", "start", "apps/web", "-H", "0.0.0.0", "-p", "3000"]
    environment:
      NODE_ENV: production
      # Server-side (middleware) calls stay on the internal network.
      API_INTERNAL_BASE_URL: http://api:4000/api/v1
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5
    depends_on:
      api:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      SERVER_NAME: ${SERVER_NAME:?SERVER_NAME is required}
    volumes:
      - ./nginx/prod/templates:/etc/nginx/templates:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      web:
        condition: service_healthy
    networks: [internal]

volumes:
  postgres-data:
  minio-data:

networks:
  internal:
    driver: bridge
